services:
  db:
    image: postgres:15
    container_name: payment_db
    restart: always
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: postgres2084
      POSTGRES_DB: payment_service_db
    ports:
      - "5435:5432"

  app:
    build: .
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    container_name: payment_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
